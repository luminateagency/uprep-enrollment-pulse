<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>U Prep Enrollment Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Faustina:wght@500;600;700&family=Asap:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F4F8;
    --surface: #FFFFFF;
    --surface-2: #EEE6EF;
    --ink: #241A27;
    --ink-soft: #6E5873;
    --line: #E1D3E4;
    --navy: #5D2062;
    --navy-ink: #3B133F;
    --gold: #A438AD;
    --gold-soft: #F3ECF4;
    --shadow: 0 1px 2px rgba(93,32,98,0.08), 0 8px 24px rgba(93,32,98,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1A0E1B;
      --surface: #29182A;
      --surface-2: #39213B;
      --ink: #EEECEF;
      --ink-soft: #C2ABC4;
      --line: #553758;
      --navy: #D184D7;
      --navy-ink: #F0DFF2;
      --gold: #E0B5E3;
      --gold-soft: #421745;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1A0E1B;
    --surface: #29182A;
    --surface-2: #39213B;
    --ink: #EEECEF;
    --ink-soft: #C2ABC4;
    --line: #553758;
    --navy: #D184D7;
    --navy-ink: #F0DFF2;
    --gold: #E0B5E3;
    --gold-soft: #421745;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Asap", -apple-system, "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: "Faustina", Georgia, serif; text-wrap: balance; margin: 0; }

  .wrap { max-width: 900px; margin: 0 auto; padding: 40px 24px 72px; }

  header.top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    flex-wrap: wrap;
    padding-bottom: 28px;
    margin-bottom: 32px;
    border-bottom: 1px solid var(--line);
  }
  .brand-mark { display: flex; align-items: center; gap: 14px; }
  .brand-mark img.logo { height: 34px; width: auto; display: block; }
  .brand-mark img.logo-dark { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .brand-mark img.logo-light { display: none; }
    :root:not([data-theme="light"]) .brand-mark img.logo-dark { display: block; }
  }
  :root[data-theme="dark"] .brand-mark img.logo-light { display: none; }
  :root[data-theme="dark"] .brand-mark img.logo-dark { display: block; }
  .page-name { font-size: 20px; font-weight: 600; color: var(--navy-ink); letter-spacing: -0.01em; margin-top: 8px; }
  header.top .sub { font-size: 14px; color: var(--ink-soft); margin-top: 4px; }
  .asof {
    text-align: right;
    font-size: 12px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .asof strong { display: block; font-size: 13px; color: var(--ink); text-transform: none; letter-spacing: 0; margin-top: 2px; }
  .live-chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink);
    background: var(--gold-soft);
    padding: 3px 9px 3px 7px;
    border-radius: 999px;
    margin-bottom: 6px;
  }
  .live-chip .pulse {
    width: 6px; height: 6px; border-radius: 50%; background: var(--gold);
  }

  .stack { display: flex; flex-direction: column; gap: 24px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card .stripe { height: 4px; background: var(--gold); }
  .card .stripe.navy { background: var(--navy); }

  .card-body { padding: 26px 26px 22px; display: flex; flex-direction: column; gap: 18px; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .card-head h2 { font-size: 21px; font-weight: 600; color: var(--navy-ink); }
  .card-head .tag {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--ink-soft); white-space: nowrap; margin-top: 4px;
  }
  @media (max-width: 480px) {
    .card-head { flex-direction: column; gap: 4px; }
    .card-head .tag { white-space: normal; }
  }

  .stat-row { display: flex; gap: 28px; flex-wrap: wrap; }
  .stat .num { font-family: "Faustina", Georgia, serif; font-size: 38px; font-weight: 600; line-height: 1; color: var(--navy-ink); }
  .stat .label { font-size: 12px; color: var(--ink-soft); margin-top: 6px; max-width: 16em; }

  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  @media (max-width: 620px) { .split { grid-template-columns: 1fr; } }
  .split.tri { grid-template-columns: 1fr 1fr 1fr; }
  .split h3 { font-family: "Asap", sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-soft); font-weight: 600; margin-bottom: 10px; }

  .bars { display: flex; flex-direction: column; gap: 8px; }
  .bar-row { display: grid; grid-template-columns: 108px 1fr 30px; align-items: center; gap: 10px; font-size: 13px; }
  .bar-row .name { color: var(--ink-soft); }
  .bar-track { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; }
  .bar-row .count { text-align: right; color: var(--ink); font-weight: 600; }

  .list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .row .who { font-size: 13.5px; color: var(--ink); font-weight: 600; }
  .row .meta { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .row .when { font-size: 12px; color: var(--ink-soft); white-space: nowrap; text-align: right; }

  .callout {
    display: flex; gap: 10px; align-items: flex-start;
    background: var(--surface-2);
    border-radius: 10px;
    padding: 13px 15px;
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.55;
  }
  .callout strong { color: var(--ink); }

  .budget-bar { height: 14px; background: var(--surface-2); border-radius: 7px; overflow: hidden; margin: 2px 0 3px; }
  .budget-bar-fill { height: 100%; border-radius: 7px; background: var(--gold); }
  .budget-caption { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-soft); }
  .budget-caption strong { color: var(--ink); }

  footer.notes {
    margin-top: 8px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.6;
  }
  footer.notes strong { color: var(--ink); }
</style>
</head>
